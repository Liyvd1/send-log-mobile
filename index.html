<style>
  :root {
    --bg: #e7e9e1;
    --surface: #f6f7f1;
    --surface-raised: #ffffff;
    --border: #cdd0c4;
    --ink: #1d2220;
    --ink-dim: #5c655c;
    --ink-faint: #8b9288;
    --accent: #1f5c82;
    --accent-ink: #f2f8fb;
    --accent-dim: #d7e6ee;
    --flash: #a3720f;
    --flash-bg: #f3e6c8;
    --send: #2f7a4f;
    --send-bg: #dcebe0;
    --attempt-bg: #e2e4da;
    --danger: #a33a2e;
    --shadow: 0 1px 2px rgba(29,34,32,.08), 0 4px 14px rgba(29,34,32,.06);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #141817;
      --surface: #1c211f;
      --surface-raised: #232926;
      --border: #343c38;
      --ink: #edefe8;
      --ink-dim: #a3aca2;
      --ink-faint: #6d766c;
      --accent: #5ea3cf;
      --accent-ink: #0d1d24;
      --accent-dim: #26404d;
      --flash: #e0b354;
      --flash-bg: #3a3120;
      --send: #7fc297;
      --send-bg: #223328;
      --attempt-bg: #2a2f2b;
      --danger: #e08a76;
      --shadow: 0 1px 2px rgba(0,0,0,.35), 0 4px 16px rgba(0,0,0,.3);
    }
  }
  :root[data-theme="dark"] {
    --bg: #141817;
    --surface: #1c211f;
    --surface-raised: #232926;
    --border: #343c38;
    --ink: #edefe8;
    --ink-dim: #a3aca2;
    --ink-faint: #6d766c;
    --accent: #5ea3cf;
    --accent-ink: #0d1d24;
    --accent-dim: #26404d;
    --flash: #e0b354;
    --flash-bg: #3a3120;
    --send: #7fc297;
    --send-bg: #223328;
    --attempt-bg: #2a2f2b;
    --danger: #e08a76;
    --shadow: 0 1px 2px rgba(0,0,0,.35), 0 4px 16px rgba(0,0,0,.3);
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { background: var(--bg); }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: "IBM Plex Sans", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    padding-bottom: 48px;
  }
  .wrap { max-width: 480px; margin: 0 auto; }

  header {
    background: var(--accent);
    color: var(--accent-ink);
    padding: 18px 20px 16px;
    position: sticky;
    top: 0;
    z-index: 20;
    box-shadow: var(--shadow);
  }
  .brand-row { display: flex; align-items: baseline; justify-content: space-between; }
  h1 {
    margin: 0;
    font-family: "Big Shoulders Display", sans-serif;
    font-weight: 900;
    font-size: 30px;
    letter-spacing: .04em;
    text-transform: uppercase;
    text-wrap: balance;
  }
  .tagline { margin: 2px 0 0; font-size: 12.5px; color: var(--accent-ink); opacity: .78; }
  .status-dot { display: flex; align-items: center; gap: 6px; font-size: 11.5px; font-family: "IBM Plex Mono", monospace; opacity: .9; }
  .status-dot .dot { width: 8px; height: 8px; border-radius: 50%; background: #8fd18f; }
  .status-dot.saving .dot { background: #e0c25a; }
  .status-dot.offline .dot { background: #e08a76; }

  main { padding: 16px 16px 8px; }

  .card {
    background: var(--surface-raised);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 18px;
    box-shadow: var(--shadow);
    margin-bottom: 14px;
  }

  .eyebrow {
    font-family: "IBM Plex Mono", monospace;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: .08em;
    color: var(--ink-faint);
    margin: 0 0 6px;
  }

  .start-title { font-family: "Big Shoulders Display", sans-serif; font-weight: 800; font-size: 24px; margin: 0 0 4px; text-wrap: balance; }
  .start-sub { font-size: 13px; color: var(--ink-dim); margin: 0 0 14px; }
  .field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 12px; }
  .field label { font-size: 11.5px; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; color: var(--ink-dim); }
  .field-row { display: flex; gap: 8px; margin-bottom: 12px; }
  .field-row input { flex: 1; min-width: 0; }
  input[type="text"], input[type="number"], input[type="email"], input[type="password"], textarea {
    font-family: inherit; font-size: 16px; padding: 11px 12px;
    border-radius: 9px; border: 1px solid var(--border); background: var(--surface); color: var(--ink);
    width: 100%;
  }
  input:focus, textarea:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  textarea { resize: vertical; min-height: 54px; }

  .btn {
    font-family: "IBM Plex Sans", sans-serif;
    font-weight: 600;
    font-size: 15px;
    padding: 14px 18px;
    border-radius: 11px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--ink);
    cursor: pointer;
    width: 100%;
  }
  .btn:active { transform: scale(.98); }
  .btn:disabled { opacity: .5; }
  .btn-primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-size: 16px; }
  .btn-secondary { background: transparent; border-color: var(--border); color: var(--ink-dim); font-size: 13px; padding: 10px 14px; }
  .btn-danger-text { background: none; border: none; color: var(--danger); font-size: 13px; font-weight: 600; padding: 8px; }
  .form-error { color: var(--danger); font-size: 13px; margin: -4px 0 10px; }

  .session-bar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  .session-bar-left { display: flex; flex-direction: column; gap: 2px; }
  .session-bar-title { font-family: "Big Shoulders Display", sans-serif; font-weight: 800; font-size: 20px; }
  .session-bar-meta { font-size: 12px; color: var(--ink-dim); font-family: "IBM Plex Mono", monospace; }

  .grade-strip { display: flex; gap: 8px; overflow-x: auto; padding: 4px 2px 10px; scrollbar-width: none; }
  .grade-strip::-webkit-scrollbar { display: none; }
  .grade-chip {
    flex: 0 0 auto; min-width: 56px; height: 56px;
    display: flex; align-items: center; justify-content: center;
    font-family: "Big Shoulders Display", sans-serif; font-weight: 800; font-size: 20px;

  .segmented { display: flex; gap: 8px; margin-bottom: 12px; }
  .segmented button {
    flex: 1; padding: 12px 6px; border-radius: 10px; border: 1px solid var(--border);
    background: var(--surface); color: var(--ink); font-weight: 600; font-size: 14px;

  .segmented button.active { background: var(--accent-dim); border-color: var(--accent); color: var(--accent); }
  .segmented button.active.flash { background: var(--flash-bg); border-color: var(--flash); color: var(--flash); }
  .segmented button.active.send { background: var(--send-bg); border-color: var(--send); color: var(--send); }
  .segmented button.active.attempt { background: var(--attempt-bg); border-color: var(--ink-faint); color: var(--ink); }

  .stepper { display: flex; align-items: center; gap: 12px; }
  .stepper button {
    width: 40px; height: 40px; border-radius: 10px; border: 1px solid var(--border);
    background: var(--surface); color: var(--ink); font-size: 18px; font-weight: 700;
  }
  .stepper .count { font-family: "IBM Plex Mono", monospace; font-size: 17px; min-width: 24px; text-align: center; }

  .chip-group { display: flex; flex-wrap: wrap; gap: 7px; margin-bottom: 10px; }
  .chip {
    padding: 8px 13px; border-radius: 999px; border: 1px solid var(--border);
    background: var(--surface); color: var(--ink-dim); font-size: 13px;
  }
  .chip.selected { background: var(--accent-dim); border-color: var(--accent); color: var(--accent); }
  .chip-add-row { display: flex; gap: 8px; margin-bottom: 14px; }
  .chip-add-row input { flex: 1; font-size: 14px; padding: 8px 10px; }
  .chip-add-row button { flex: 0 0 auto; padding: 8px 14px; font-size: 13px; }

  .note-toggle { background: none; border: none; color: var(--accent); font-size: 13px; font-weight: 600; padding: 4px 0 14px; }

  .checkbox-row { display: flex; align-items: center; gap: 8px; font-size: 13.5px; color: var(--ink-dim); margin: -2px 0 12px; }
  .checkbox-row input[type="checkbox"] { width: auto; accent-color: var(--accent); }

  .media-hint { font-size: 12.5px; color: var(--ink-faint); margin: -6px 0 12px; }
  .media-stage-row { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
  .media-stage-thumb { width: 44px; height: 44px; border-radius: 8px; object-fit: cover; border: 1px solid var(--border); }
  .media-stage-clear { background: none; border: none; color: var(--danger); font-size: 13px; font-weight: 600; }

  .route-row { display: flex; gap: 8px; margin-bottom: 4px; }
  .route-row input { flex: 1; min-width: 0; }
  .route-row button { flex: 0 0 auto; padding: 11px 14px; font-size: 14px; }
  .route-link { font-size: 12px; color: var(--ink-dim); margin-top: 2px; word-break: break-all; }
  .route-link a { color: var(--accent); }

  .qr-overlay {
    position: fixed; inset: 0; background: #000; z-index: 400;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
  }
  .qr-video { width: 100%; height: 100%; object-fit: cover; }
  .qr-hint {
    position: absolute; top: 22px; left: 50%; transform: translateX(-50%);
    color: #fff; font-size: 13.5px; font-weight: 600; text-align: center; padding: 0 20px;
    text-shadow: 0 1px 4px rgba(0,0,0,.6);
  }
  .qr-frame {
    position: absolute; width: min(70vw, 260px); height: min(70vw, 260px);
    border: 3px solid #fff; border-radius: 18px; box-shadow: 0 0 0 999px rgba(0,0,0,.35);
  }
  .qr-cancel {
    position: absolute; bottom: 36px; left: 50%; transform: translateX(-50%);
    background: rgba(255,255,255,.16); border: 1px solid rgba(255,255,255,.4); color: #fff;
    border-radius: 11px; padding: 12px 26px; font-size: 14px; font-weight: 600;
  }

  .log-row { display: flex; align-items: flex-start; gap: 12px; padding: 12px 4px; border-bottom: 1px solid var(--border); }
  .log-row:last-child { border-bottom: none; }
  .log-grade { font-family: "Big Shoulders Display", sans-serif; font-weight: 800; font-size: 22px; min-width: 44px; }
  .log-main { flex: 1; min-width: 0; }
  .log-badges { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .badge { font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .03em; padding: 2px 8px; border-radius: 999px; }
  .badge.flash { background: var(--flash-bg); color: var(--flash); }
  .badge.send { background: var(--send-bg); color: var(--send); }
  .badge.attempt { background: var(--attempt-bg); color: var(--ink-dim); }
  .badge.pending { background: var(--attempt-bg); color: var(--danger); }
  .log-tags { font-size: 12px; color: var(--ink-dim); margin-top: 2px; }
  .log-time { font-family: "IBM Plex Mono", monospace; font-size: 11.5px; color: var(--ink-faint); flex-shrink: 0; }
  .log-del { background: none; border: none; color: var(--ink-faint); font-size: 18px; padding: 4px 6px; flex-shrink: 0; }
  .log-actions { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }

  .media-row { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
  .media-thumb { width: 52px; height: 52px; border-radius: 8px; object-fit: cover; border: 1px solid var(--border); }
  .media-video-badge { width: 52px; height: 52px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface); display: flex; align-items: center; justify-content: center; font-size: 20px; }
  .media-add-btn { background: none; border: 1px dashed var(--border); border-radius: 8px; color: var(--ink-faint); font-size: 18px; padding: 4px 8px; }

  .empty-hint { color: var(--ink-dim); font-size: 13.5px; text-align: center; padding: 18px 8px; }

  .banner {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    background: var(--flash-bg); color: var(--flash); border-radius: 10px; padding: 10px 14px;
    font-size: 13px; font-weight: 600; margin-bottom: 14px;
  }
  .banner button { background: none; border: 1px solid currentColor; color: inherit; border-radius: 7px; padding: 5px 10px; font-size: 12px; font-weight: 700; }

  .finish-block { text-align: center; margin-top: 4px; }
  .signout-row { text-align: center; margin-top: 18px; }
  .signout-row button { background: none; border: none; color: var(--ink-faint); font-size: 12px; text-decoration: underline; }

  .toast {
    position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%);
    background: var(--ink); color: var(--bg); padding: 10px 18px; border-radius: 9px;
    font-size: 13px; font-weight: 600; box-shadow: var(--shadow); z-index: 50; max-width: 90%; text-align: center;
  }

  .tab-row { display: flex; gap: 6px; margin-top: 12px; }
  .tab-btn {
    flex: 1; background: rgba(255,255,255,.14); border: 1px solid rgba(255,255,255,.22);
    color: var(--accent-ink); font-weight: 600; font-size: 13px; padding: 8px 0; border-radius: 9px;
  }
  .tab-btn.active { background: var(--accent-ink); color: var(--accent); border-color: var(--accent-ink); }

  /* stats view */
  .kpi-row { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 14px; }
  .kpi-tile { background: var(--surface-raised); border: 1px solid var(--border); border-radius: 12px; padding: 12px 14px; box-shadow: var(--shadow); }
  .kpi-label { font-family: "IBM Plex Mono", monospace; font-size: 10.5px; text-transform: uppercase; letter-spacing: .06em; color: var(--ink-faint); }
  .kpi-value { font-family: "Big Shoulders Display", sans-serif; font-weight: 800; font-size: 26px; margin-top: 2px; }
  .kpi-value .kpi-unit { font-size: 14px; color: var(--ink-dim); margin-left: 2px; }

  .chart-legend { display: flex; gap: 12px; margin-bottom: 10px; flex-wrap: wrap; }
  .chart-legend-item { display: flex; align-items: center; gap: 5px; font-size: 11.5px; color: var(--ink-dim); }
  .chart-legend-swatch { width: 9px; height: 9px; border-radius: 3px; flex-shrink: 0; }

  .hbar-rows { display: flex; flex-direction: column; gap: 7px; }
  .hbar-row { display: grid; grid-template-columns: 40px 1fr auto; align-items: center; gap: 8px; }
  .hbar-row.wide-label { grid-template-columns: 108px 1fr auto; }
  .hbar-row-label { font-size: 12px; font-weight: 600; color: var(--ink-dim); text-align: right; }
  .hbar-row.wide-label .hbar-row-label { text-align: left; text-transform: capitalize; }
  .hbar-track { display: flex; height: 18px; border-radius: 0 4px 4px 0; overflow: hidden; background: var(--surface); }
  .hbar-seg { height: 100%; min-width: 3px; }
  .hbar-seg + .hbar-seg { border-left: 2px solid var(--surface-raised); }
  .hbar-row-value { font-size: 11.5px; color: var(--ink-dim); font-weight: 600; min-width: 18px; }

  .line-chart { display: block; width: 100%; height: auto; }
  .line-chart .grid-line { stroke: var(--border); stroke-width: 1; }
  .line-chart .chart-area { fill: var(--accent); opacity: .12; }
  .line-chart .chart-line { fill: none; stroke: var(--accent); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
  .line-chart .chart-dot { fill: var(--accent); stroke: var(--surface-raised); stroke-width: 2; }
  .line-chart .chart-axis-label { fill: var(--ink-dim); font-size: 10px; }
  .line-chart .chart-end-label { fill: var(--ink); font-size: 11.5px; font-weight: 700; }

  [hidden] { display: none !important; }
</style>

<script>
const SUPABASE_URL = "https://dretbtasvtzyrzovdczs.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_vuI6ldmESFAxu5D6lMr-8g_cqrBMG5l";

const TAG_PRESETS = ["crimps","slopers","pinches","pockets","dynos","overhangs","slab","footwork","mantles","compression","coordination","heel_hook","toe_hook"];
const GRADES = Array.from({length: 18}, (_, i) => "V" + i);

const EXERCISE_CATEGORIES = ["finger_strength", "pulling", "pushing", "core", "mobility", "other"];
const CATEGORY_LABELS = {
  finger_strength: "Finger Strength", pulling: "Pulling", pushing: "Pushing",
  core: "Core", mobility: "Mobility", other: "Other",
};
const COMMON_EXERCISE_NAMES = [
  "Fingerboard max hangs", "Fingerboard repeaters", "Campus board ladders", "Pinch block hangs",
  "Pull-ups", "Weighted pull-ups", "Lock-off holds", "Rows (TRX / rings)",
  "Push-ups", "Dips", "Overhead press",
  "Hanging leg raises", "Plank", "Front lever progressions",
  "Wrist curls / extensions", "Shoulder external rotation", "Hip flexor / hamstring stretch",
];

const RESULT_COLORS = { flash: "var(--flash)", send: "var(--send)", attempt: "var(--ink-faint)" };
const RESULT_ORDER = ["flash", "send", "attempt"];
const RESULT_LABELS = { flash: "Flash", send: "Send", attempt: "Attempt" };

let currentUser = null;
let state = {
  session: null,
  climbs: [],
  exercises: [],
  draft: { grade: "V4", result: null, attempts: 1, tags: new Set(), notes: "", route: "", mediaFile: null, mediaPreviewUrl: null },
  exerciseDraft: { category: "", isBodyweight: false },
  customTags: [],
  startType: "climbing",
  tab: "log",
};

// Renders a climb's route_ref as a tappable link (e.g. a gym's Griptonite
// route page from a scanned QR code) when it looks like a URL, or as plain
// text otherwise (a hand-typed route ID/name).
function routeRefHtml(c) {
  if (!c.route_ref) return "";
  const ref = c.route_ref;
  const isUrl = /^https?:\/\//i.test(ref);
  return isUrl
    ? `<div class="log-tags route-link">🔗 <a href="${escapeHtml(ref)}" target="_blank" rel="noopener">${escapeHtml(ref)}</a></div>`
    : `<div class="log-tags route-link">🔗 ${escapeHtml(ref)}</div>`;
}

// Renders an exercise's weight as "Body weight", "Body weight + 5 kg", or
// "5 kg" -- or null if nothing was recorded either way.
function weightLabel(ex) {
  if (ex.is_bodyweight) return ex.weight_kg ? `Body weight + ${ex.weight_kg} kg` : "Body weight";
  return ex.weight_kg ? `${ex.weight_kg} kg` : null;
}

function $(id) { return document.getElementById(id); }
function escapeHtml(s) { const d = document.createElement("div"); d.textContent = s ?? ""; return d.innerHTML; }
function todayIso() { const d = new Date(); return new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10); }
function timeLabel(iso) { const d = new Date(iso); return d.toLocaleTimeString(undefined, { hour: "2-digit", minute: "2-digit" }); }
function formatDateShort(iso) {
  const d = new Date(`${iso}T00:00:00`);
  if (Number.isNaN(d.getTime())) return iso;
  return d.toLocaleDateString(undefined, { month: "short", day: "numeric" });
}
function formatDateFull(iso) {
  const d = new Date(`${iso}T00:00:00`);
  if (Number.isNaN(d.getTime())) return iso;
  return d.toLocaleDateString(undefined, { month: "short", day: "numeric", year: "numeric" });
}
function numOrNull(v, isFloat) {
  if (v === "" || v == null) return null;
  const n = isFloat ? parseFloat(v) : parseInt(v, 10);
  return Number.isNaN(n) ? null : n;
}
function showToast(msg) {
  const t = $("toast");
  t.textContent = msg;
  t.hidden = false;
  clearTimeout(showToast._t);
  showToast._t = setTimeout(() => { t.hidden = true; }, 2800);
}
function setStatus(mode, text) {
  const el = $("status-dot");
  el.className = "status-dot" + (mode === "saving" ? " saving" : mode === "offline" ? " offline" : "");
  $("status-text").textContent = text;
}

// ---------------------------------------------------------------- auth ---
function renderAuthCard(errorMsg) {
  $("main").innerHTML = `
    <div class="card">
      <p class="eyebrow">Welcome</p>
      <h2 class="start-title">Sign in to Send Log</h2>
      <p class="start-sub">First time? Just enter an email and a password you'll remember — it creates your account.</p>
      ${errorMsg ? `<p class="form-error">${escapeHtml(errorMsg)}</p>` : ""}
      <div class="field"><label>Email</label><input type="email" id="a-email" autocomplete="email"></div>
      <div class="field"><label>Password</label><input type="password" id="a-password" autocomplete="current-password"></div>
      <button class="btn btn-primary" id="a-continue">Continue</button>
    </div>
  `;
  $("a-continue").addEventListener("click", handleAuth);
}

async function handleAuth() {
  const email = $("a-email").value.trim();
  const password = $("a-password").value;
  if (!email || !password) { renderAuthCard("Enter an email and password."); return; }
  const btn = $("a-continue");
  btn.disabled = true;
  try {
    let { data, error } = await sb.auth.signInWithPassword({ email, password });
    if (error) {
      const signUp = await sb.auth.signUp({ email, password });
      if (signUp.error) throw signUp.error;
      data = signUp.data;
    }
    currentUser = data.user;
    await loadTodaySession();
    render();
  } catch (err) {
    renderAuthCard(err.message || "Couldn't sign in.");
  } finally {
    btn.disabled = false;
  }
}

      state.tab = btn.dataset.tab;

}

function render() {

  $("tab-row").querySelectorAll(".tab-btn").forEach((b) => b.classList.toggle("active", b.dataset.tab === state.tab));
  const main = $("main");

function wireClimbSection() {
  $("grade-strip").querySelectorAll(".grade-chip").forEach((btn) =>

// --------------------------------------------------------------- stats ---
// Mirrors app/analysis.py on the desktop side -- same aggregations, done
// client-side here since this page talks to Supabase directly.

function computeSummary(sessions, climbs) {
  const total = climbs.length;
  const sent = climbs.filter((c) => c.result === "flash" || c.result === "send");
  const hardest = sent.length ? sent.reduce((a, b) => (a.grade_rank >= b.grade_rank ? a : b)).grade_label : null;
  return {
    total_sessions: sessions.length,
    total_climbs: total,
    hardest_grade: hardest,
    send_rate: total ? Math.round((sent.length / total) * 1000) / 10 : null,
  };
}

function computeGradePyramid(climbs) {
  const byRank = {};
  for (const c of climbs) {
    const r = c.grade_rank;
    if (!byRank[r]) byRank[r] = { grade_label: c.grade_label, grade_rank: r, flash: 0, send: 0, attempt: 0 };
    byRank[r][c.result] += 1;
  }
  return Object.values(byRank).sort((a, b) => a.grade_rank - b.grade_rank);
}

function computeProgressOverTime(climbs) {
  const byDate = {};
  for (const c of climbs) {
    if ((c.result === "flash" || c.result === "send") && c.session_date) {
      byDate[c.session_date] = (byDate[c.session_date] || 0) + 1;
    }
  }
  let running = 0;
  return Object.keys(byDate).sort().map((date) => {
    running += byDate[date];
    return { date, cumulative_sends: running };
  });
}

function computeTopTags(climbs, limit = 8) {
  const counts = {};
  for (const c of climbs) for (const t of c.tags || []) counts[t] = (counts[t] || 0) + 1;
  return Object.entries(counts)
    .sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0]))
    .slice(0, limit)
    .map(([name, count]) => ({ name, count }));
}

function computeStrengthVolume(exercises) {
  const counts = {};
  for (const e of exercises) counts[e.category] = (counts[e.category] || 0) + 1;
  return Object.entries(counts)
    .sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0]))
    .map(([category, count]) => ({ category, count }));
}

function kpiTileHtml(label, value, unit) {
  return `<div class="kpi-tile"><div class="kpi-label">${label}</div><div class="kpi-value">${value}${unit ? `<span class="kpi-unit">${unit}</span>` : ""}</div></div>`;
}

function gradePyramidHtml(rows) {
  if (!rows.length) return `<p class="empty-hint">No climbs logged yet.</p>`;
  const ordered = rows.slice().reverse(); // hardest grade on top
  const maxTotal = Math.max(...ordered.map((r) => r.flash + r.send + r.attempt));
  const legend = `<div class="chart-legend">${RESULT_ORDER.map(
    (r) => `<div class="chart-legend-item"><span class="chart-legend-swatch" style="background:${RESULT_COLORS[r]}"></span>${RESULT_LABELS[r]}</div>`
  ).join("")}</div>`;
  const rowsHtml = ordered.map((r) => {
    const total = r.flash + r.send + r.attempt;
    const widthPct = maxTotal ? (total / maxTotal) * 100 : 0;
    const segs = RESULT_ORDER.filter((k) => r[k] > 0)
      .map((k) => `<div class="hbar-seg" style="width:${(r[k] / total) * 100}%;background:${RESULT_COLORS[k]}" title="${RESULT_LABELS[k]}: ${r[k]}"></div>`)
      .join("");
    return `<div class="hbar-row"><div class="hbar-row-label">${r.grade_label}</div><div class="hbar-track" style="width:${widthPct}%">${segs}</div><div class="hbar-row-value">${total}</div></div>`;
  }).join("");
  return `${legend}<div class="hbar-rows">${rowsHtml}</div>`;
}

function tagsChartHtml(rows) {
  if (!rows.length) return `<p class="empty-hint">No technique tags logged yet.</p>`;
  const max = Math.max(...rows.map((r) => r.count));
  const rowsHtml = rows.map((r) => {
    const label = r.name.replace(/_/g, " ");
    return `<div class="hbar-row wide-label"><div class="hbar-row-label">${escapeHtml(label)}</div><div class="hbar-track" style="width:${(r.count / max) * 100}%"><div class="hbar-seg" style="width:100%;background:var(--accent)" title="${escapeHtml(label)}: ${r.count}"></div></div><div class="hbar-row-value">${r.count}</div></div>`;
  }).join("");
  return `<div class="hbar-rows">${rowsHtml}</div>`;
}

function strengthChartHtml(rows) {
  if (!rows.length) return `<p class="empty-hint">No strength training logged yet.</p>`;
  const max = Math.max(...rows.map((r) => r.count));
  const rowsHtml = rows.map((r) => {
    const label = CATEGORY_LABELS[r.category] || r.category;
    return `<div class="hbar-row wide-label"><div class="hbar-row-label">${escapeHtml(label)}</div><div class="hbar-track" style="width:${(r.count / max) * 100}%"><div class="hbar-seg" style="width:100%;background:var(--accent)" title="${escapeHtml(label)}: ${r.count} logged"></div></div><div class="hbar-row-value">${r.count}</div></div>`;
  }).join("");
  return `<div class="hbar-rows">${rowsHtml}</div>`;
}

function progressChartHtml(rows) {
  if (!rows.length) return `<p class="empty-hint">Log a flash or send to start your progress chart.</p>`;
  const W = 340, H = 150, padL = 26, padR = 12, padT = 14, padB = 22;
  const innerW = W - padL - padR;
  const innerH = H - padT - padB;
  const maxVal = Math.max(...rows.map((r) => r.cumulative_sends));
  const n = rows.length;
  const xAt = (i) => padL + (n === 1 ? innerW / 2 : (innerW * i) / (n - 1));
  const yAt = (v) => padT + innerH - (maxVal ? (v / maxVal) * innerH : 0);
  const points = rows.map((r, i) => [xAt(i), yAt(r.cumulative_sends)]);
  const linePath = points.map(([x, y], i) => `${i === 0 ? "M" : "L"}${x.toFixed(1)},${y.toFixed(1)}`).join(" ");
  const baseline = (padT + innerH).toFixed(1);
  const areaPath = `${linePath} L${points[points.length - 1][0].toFixed(1)},${baseline} L${points[0][0].toFixed(1)},${baseline} Z`;
  const dots = points
    .map(([x, y], i) => `<circle class="chart-dot" cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="4"><title>${formatDateFull(rows[i].date)}: ${rows[i].cumulative_sends} sends</title></circle>`)
    .join("");
  const last = points[points.length - 1];
  const lastVal = rows[rows.length - 1].cumulative_sends;
  return `
    <svg class="line-chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
      <line class="grid-line" x1="${padL}" y1="${padT}" x2="${W - padR}" y2="${padT}"></line>
      <line class="grid-line" x1="${padL}" y1="${baseline}" x2="${W - padR}" y2="${baseline}"></line>
      <text class="chart-axis-label" x="2" y="${padT + 4}">${maxVal}</text>
      <text class="chart-axis-label" x="2" y="${baseline}">0</text>
      ${points.length > 1 ? `<path class="chart-area" d="${areaPath}"></path><path class="chart-line" d="${linePath}"></path>` : ""}
      ${dots}
      <text class="chart-end-label" x="${Math.max(padL, last[0] - 8).toFixed(1)}" y="${Math.max(padT + 10, last[1] - 8).toFixed(1)}" text-anchor="end">${lastVal}</text>
      <text class="chart-axis-label" x="${padL}" y="${H - 6}">${formatDateShort(rows[0].date)}</text>
      <text class="chart-axis-label" x="${W - padR}" y="${H - 6}" text-anchor="end">${formatDateShort(rows[rows.length - 1].date)}</text>
    </svg>`;
}

function buildStatsHtml(rawSessions, rawClimbs, rawExercises) {
  const dateBySession = Object.fromEntries(rawSessions.map((s) => [s.id, s.date]));
  const climbs = rawClimbs.map((c) => ({ ...c, session_date: dateBySession[c.session_id] }));
  const summary = computeSummary(rawSessions, climbs);

  if (!summary.total_sessions) {
    return `<div class="card"><p class="empty-hint">No sessions logged yet. Start one from the Log tab — your stats will show up here.</p></div>`;
  }

  return `
    <div class="kpi-row">
      ${kpiTileHtml("Sessions", summary.total_sessions)}
      ${kpiTileHtml("Climbs", summary.total_climbs)}
      ${kpiTileHtml("Hardest Send", summary.hardest_grade || "—")}
      ${kpiTileHtml("Send Rate", summary.send_rate != null ? summary.send_rate : "—", summary.send_rate != null ? "%" : "")}
    </div>
    <div class="card"><p class="eyebrow">Grade Pyramid</p>${gradePyramidHtml(computeGradePyramid(climbs))}</div>
    <div class="card"><p class="eyebrow">Sends Over Time</p>${progressChartHtml(computeProgressOverTime(climbs))}</div>
    <div class="card"><p class="eyebrow">Top Technique Tags</p>${tagsChartHtml(computeTopTags(climbs))}</div>
    <div class="card"><p class="eyebrow">Strength Training Volume</p>${strengthChartHtml(computeStrengthVolume(rawExercises))}</div>
  `;
}

async function renderStatsView() {
  const main = $("main");
  main.innerHTML = `<p class="empty-hint">Loading…</p>`;
  try {
    const [{ data: sessions, error: e1 }, { data: climbs, error: e2 }, { data: exercises, error: e3 }] = await Promise.all([
      sb.from("sessions").select("*"),
      sb.from("climbs").select("*"),
      sb.from("strength_exercises").select("*"),
    ]);
    const error = e1 || e2 || e3;
    if (error) throw error;
    main.innerHTML = buildStatsHtml(sessions || [], climbs || [], exercises || []);
  } catch (err) {
    main.innerHTML = `<p class="empty-hint">Couldn't load stats: ${escapeHtml(err.message || String(err))}</p>`;
  }
}

// ---- session ops ----
async function loadTodaySession() {
  const { data: sessions, error } = await sb.from("sessions").select("*").eq("date", todayIso()).eq("active", true).limit(1);
  if (error) { showToast("Couldn't load today's session"); return; }
  if (!sessions.length) { state.session = null; state.climbs = []; state.exercises = []; return; }
  state.session = sessions[0];
  const [{ data: climbs }, { data: exercises }] = await Promise.all([
    sb.from("climbs").select("*").eq("session_id", state.session.id).order("created_at", { ascending: false }),
    sb.from("strength_exercises").select("*").eq("session_id", state.session.id).order("created_at", { ascending: false }),
  ]);
  state.climbs = climbs || [];
  state.exercises = exercises || [];
  if (state.climbs.length) await attachMediaToClimbs();
}

async function attachMediaToClimbs() {
  const ids = state.climbs.map((c) => c.id);
  const { data: mediaRows } = await sb.from("media").select("*").in("climb_id", ids);
  if (!mediaRows) return;
  for (const climb of state.climbs) {
    climb.media = mediaRows.filter((m) => m.climb_id === climb.id);
    for (const m of climb.media) m._url = await signedUrl(m.storage_path);
  }
}

async function signedUrl(path) {
  try {
    const { data } = await sb.storage.from("media").createSignedUrl(path, 3600);
    return data?.signedUrl || "";
  } catch (e) { return ""; }
}

async function startSession() {
  const btn = $("s-start");
  btn.disabled = true;
  const body = {
    date: todayIso(),
    session_type: state.startType,
    location: $("s-location").value.trim() || null,
    active: true,
  };
  try {
    const { data, error } = await sb.from("sessions").insert(body).select().single();
    if (error) throw error;
    state.session = data;
    state.climbs = [];
    state.exercises = [];
    render();
  } catch (err) {
    showToast("Couldn’t start session: " + err.message);
  } finally {
    btn.disabled = false;
  }
}

function signOut() {
  sb.auth.signOut();
  currentUser = null;
  state = {
    session: null, climbs: [], exercises: [],
    draft: { grade: "V4", result: null, attempts: 1, tags: new Set(), notes: "", route: "", mediaFile: null, mediaPreviewUrl: null },
    exerciseDraft: { category: "", isBodyweight: false },
    customTags: [], startType: "climbing", tab: "log",
  };
  $("tab-row").hidden = true;
  renderAuthCard();
}

// ---- climb ops ----
async function logClimb() {
  const draft = state.draft;
  if (!draft.result) { showToast("Pick flash / send / attempt"); return; }
  const stagedFile = draft.mediaFile;
  if (draft.mediaPreviewUrl) URL.revokeObjectURL(draft.mediaPreviewUrl);
  const localId = "local-" + Date.now() + "-" + Math.random().toString(36).slice(2, 7);
  const body = {
    session_id: state.session.id,
    grade_label: draft.grade,
    grade_rank: parseInt(draft.grade.slice(1), 10),
    result: draft.result,
    attempts: draft.attempts,
    tags: Array.from(draft.tags),
    notes: draft.notes || null,
    route_ref: draft.route || null,
  };
  const optimistic = { id: localId, ...body, created_at: new Date().toISOString(), media: [], _pending: true };
  state.climbs.unshift(optimistic);
  state.draft = { grade: draft.grade, result: null, attempts: 1, tags: new Set(), notes: "", route: "", mediaFile: null, mediaPreviewUrl: null };
  render();
  setStatus("saving", "saving…");
  try {
    const { data, error } = await sb.from("climbs").insert(body).select().single();
    if (error) throw error;
    const item = state.climbs.find((c) => c.id === localId);
    if (item) { Object.assign(item, data); item._pending = false; item.media = []; }
    setStatus("ok", "saved");
    render();
    if (stagedFile) await uploadMedia(data.id, stagedFile);
  } catch (err) {
    setStatus("offline", "will retry");
    showToast(stagedFile ? "Couldn’t save — tap Retry when back online, then add the photo/video" : "Couldn’t save — tap Retry when back online");
  }
}

async function deleteClimb(id) {
  state.climbs = state.climbs.filter((c) => c.id !== id);
  render();
  if (!id.startsWith("local-")) {
    try { await sb.from("climbs").delete().eq("id", id); } catch (err) { showToast("Couldn’t delete on server"); }
  }
}

// ---- exercise ops ----
async function logExercise() {
  const name = $("e-name").value.trim();
  const category = state.exerciseDraft.category;
  if (!name) { showToast("Enter an exercise name"); return; }
  if (!category) { showToast("Pick a category"); return; }
  const localId = "local-" + Date.now() + "-" + Math.random().toString(36).slice(2, 7);
  const body = {
    session_id: state.session.id,
    exercise_name: name,
    category,
    sets: numOrNull($("e-sets").value),
    reps: numOrNull($("e-reps").value),
    weight_kg: numOrNull($("e-weight").value, true),
    is_bodyweight: state.exerciseDraft.isBodyweight,
    notes: $("e-notes").value.trim() || null,
  };
  const optimistic = { id: localId, ...body, created_at: new Date().toISOString(), _pending: true };
  state.exercises.unshift(optimistic);
  state.exerciseDraft = { category, isBodyweight: false };
  render();
  setStatus("saving", "saving…");
  try {
    const { data, error } = await sb.from("strength_exercises").insert(body).select().single();
    if (error) throw error;
    const item = state.exercises.find((e) => e.id === localId);
    if (item) { Object.assign(item, data); item._pending = false; }
    setStatus("ok", "saved");
    render();
  } catch (err) {
    setStatus("offline", "will retry");
    showToast("Couldn’t save — tap Retry when back online");
  }
}

async function deleteExercise(id) {
  state.exercises = state.exercises.filter((e) => e.id !== id);
  render();
  if (!id.startsWith("local-")) {
    try { await sb.from("strength_exercises").delete().eq("id", id); } catch (err) { showToast("Couldn’t delete on server"); }
  }
}

async function retryPending() {
  const pendingClimbs = state.climbs.filter((c) => c._pending);
  const pendingExercises = state.exercises.filter((e) => e._pending);
  if (!pendingClimbs.length && !pendingExercises.length) return;
  setStatus("saving", "syncing…");
  for (const item of pendingClimbs) {
    try {
      const { id, _pending, media, created_at, ...body } = item;
      const { data, error } = await sb.from("climbs").insert(body).select().single();
      if (error) throw error;
      Object.assign(item, data);
      item._pending = false;
      item.media = [];
    } catch (err) { /* still offline */ }
  }
  for (const item of pendingExercises) {
    try {
      const { id, _pending, created_at, ...body } = item;
      const { data, error } = await sb.from("strength_exercises").insert(body).select().single();
      if (error) throw error;
      Object.assign(item, data);
      item._pending = false;
    } catch (err) { /* still offline */ }
  }
  const stillPending = state.climbs.some((c) => c._pending) || state.exercises.some((e) => e._pending);
  setStatus(stillPending ? "offline" : "ok", stillPending ? "will retry" : "saved");
  render();
}

// ---- QR scan (route reference) ----
// Reads a QR code via the camera, client-side, with jsQR -- works on both
// Android and iOS since it's plain getUserMedia + canvas, unlike NFC which
// only Android Chrome exposes to web pages. onResult gets the decoded text
// (typically a URL from the gym's route tag).
function openQrScanner(onResult) {
  const overlay = document.createElement("div");
  overlay.className = "qr-overlay";
  overlay.innerHTML = `
    <p class="qr-hint">Point your camera at the route's QR code</p>
    <video class="qr-video" autoplay playsinline muted></video>
    <div class="qr-frame"></div>
    <button type="button" class="qr-cancel" id="qr-cancel-btn">Cancel</button>
  `;
  document.body.appendChild(overlay);

  const video = overlay.querySelector("video");
  const canvas = document.createElement("canvas");
  const ctx = canvas.getContext("2d", { willReadFrequently: true });
  let stream = null;
  let stopped = false;

  function cleanup() {
    if (stopped) return;
    stopped = true;
    if (stream) stream.getTracks().forEach((t) => t.stop());
    overlay.remove();
  }
  overlay.querySelector("#qr-cancel-btn").addEventListener("click", cleanup);

  function tick() {
    if (stopped) return;
    if (video.readyState === video.HAVE_ENOUGH_DATA && video.videoWidth) {
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
      const code = window.jsQR(imageData.data, imageData.width, imageData.height);
      if (code && code.data) {
        cleanup();
        onResult(code.data);
        return;
      }
    }
    requestAnimationFrame(tick);
  }

  navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } })
    .then((s) => {
      if (stopped) { s.getTracks().forEach((t) => t.stop()); return; }
      stream = s;
      video.srcObject = s;
      video.play();
      requestAnimationFrame(tick);
    })
    .catch((err) => {
      cleanup();
      showToast("Couldn’t access camera: " + (err.message || err));
    });
}

// ---- media ops ----
function pickStagedMedia() {
  const input = document.createElement("input");
  input.type = "file";
  input.accept = "image/*,video/*";
  input.capture = "environment";
  input.onchange = () => {
    const file = input.files && input.files[0];
    if (!file) return;
    if (state.draft.mediaPreviewUrl) URL.revokeObjectURL(state.draft.mediaPreviewUrl);
    state.draft.mediaFile = file;
    state.draft.mediaPreviewUrl = file.type.startsWith("video/") ? null : URL.createObjectURL(file);
    render();
  };
  input.click();
}

function clearStagedMedia() {
  if (state.draft.mediaPreviewUrl) URL.revokeObjectURL(state.draft.mediaPreviewUrl);
  state.draft.mediaFile = null;
  state.draft.mediaPreviewUrl = null;
  render();
}

function pickAndUploadMedia(climbId) {
  const input = document.createElement("input");
  input.type = "file";
  input.accept = "image/*,video/*";
  input.capture = "environment";
  input.onchange = () => {
    if (input.files && input.files[0]) uploadMedia(climbId, input.files[0]);
  };
  input.click();
}

async function uploadMedia(climbId, file) {
  if (!currentUser) return;
  setStatus("saving", "uploading…");
  const mediaType = file.type.startsWith("video/") ? "video" : "image";
  const ext = (file.name.split(".").pop() || (mediaType === "video" ? "mp4" : "jpg")).toLowerCase();
  const path = `${currentUser.id}/${Date.now()}-${Math.random().toString(36).slice(2, 8)}.${ext}`;
  try {
    const { error: uploadErr } = await sb.storage.from("media").upload(path, file);
    if (uploadErr) throw uploadErr;
    const { data, error } = await sb.from("media").insert({
      climb_id: climbId, storage_path: path, media_type: mediaType, original_filename: file.name,
    }).select().single();
    if (error) throw error;
    data._url = mediaType === "image" ? await signedUrl(path) : "";
    const climb = state.climbs.find((c) => c.id === climbId);
    if (climb) { climb.media = (climb.media || []).concat(data); }
    setStatus("ok", "saved");
    render();
    showToast("Media attached");
  } catch (err) {
    setStatus("ok", "saved");
    showToast("Couldn’t upload: " + err.message);
  }
}

// ---- finish session ----
function openFinishSheet() {
  const elapsedMs = Date.now() - new Date(state.session.created_at).getTime();
  const suggestedMin = Math.max(5, Math.round(elapsedMs / 60000 / 5) * 5);
  const html = `
    <div class="card" id="finish-card">
      <p class="eyebrow">Wrap up</p>
      <h2 class="start-title">Finish session</h2>
      <div class="field"><label>Duration (min)</label><input type="number" id="f-duration" value="${suggestedMin}"></div>
      <div class="field"><label>RPE / fatigue (1-10)</label><input type="number" id="f-rpe" min="1" max="10" value="6"></div>
      <div class="field"><label>Notes (optional)</label><textarea id="f-notes" placeholder="How did it feel?"></textarea></div>
      <button class="btn btn-primary" id="f-save">Save &amp; Finish</button>
      <div class="finish-block"><button class="btn-danger-text" id="f-cancel">Keep logging instead</button></div>
    </div>
  `;
  $("main").insertAdjacentHTML("beforeend", html);
  $("f-cancel").addEventListener("click", () => $("finish-card").remove());
  $("f-save").addEventListener("click", finishSession);
}

async function finishSession() {
  const body = {
    active: false,
    duration_minutes: parseInt($("f-duration").value, 10) || null,
    rpe: parseInt($("f-rpe").value, 10) || null,
    notes: $("f-notes").value.trim() || null,
    ended_at: new Date().toISOString(),
  };
  try {
    await sb.from("sessions").update(body).eq("id", state.session.id);
    showToast("Session saved — nice work");
  } catch (err) {
    showToast("Couldn’t save finish details");
  }
  state.session = null;
  state.climbs = [];
  state.exercises = [];
  state.startType = "climbing";
  render();
}

// ---------------------------------------------------------------- boot ---
async function boot() {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) {
    renderAuthCard();
    setStatus("offline", "signed out");
    return;
  }
  currentUser = session.user;
  setStatus("ok", "connected");
  await loadTodaySession();
  render();
}

initTabs();
boot();
</script>
</body>
</html>
